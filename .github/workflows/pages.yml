name: Test and deploy SMARTLIBverse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed game in Chromium
        env:
          BASE_URL: https://skpkt.github.io/smartlibverse/
        run: |
          for attempt in 1 2 3; do
            if npm run test:browser; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-start-plaza-acceptance
          path: test-results/
